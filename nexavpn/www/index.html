<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04070b">
<style>html{background:#04070b;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>NexaVPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width app column, centered on desktop; glass tab bar floats over a dotted globe that sits behind every screen. */
:root{
  --bg:#04070b; --glass:rgba(30,36,46,.5); --glass-2:rgba(22,27,35,.82);
  --line:rgba(255,255,255,.09); --fg:#f4f7fb; --muted:#8c97a8; --dim:#5d6878;
  --accent:#2f7bff; --accent-soft:rgba(47,123,255,.16);
  --ok:#33d17a; --warn:#ffb340; --bad:#ff5c5c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;-webkit-font-smoothing:antialiased;touch-action:manipulation;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;display:flex;align-items:center;justify-content:center;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;width:100%;max-width:430px;height:100%;background:var(--bg);overflow:hidden}
@media (min-width:520px) and (min-height:760px){
  #app{height:min(100%,880px);border-radius:46px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}
}
#globe{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}
#app[data-tab="servers"] #globe,#app[data-tab="profile"] #globe,#app[data-tab="chat"] #globe,#app[data-mode="auth"] #globe,#app[data-mode="key"] #globe{opacity:.35}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transform:translateZ(0)}

.screen,.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar,.view::-webkit-scrollbar{display:none}
.view{padding:18px 20px 120px;contain:layout paint style;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.enter{animation:enter .32s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

/* ---------- auth ---------- */
#auth,#keyscr{padding:44px 24px 28px;display:flex;flex-direction:column;align-items:center}
#keyscr .btn+.btn{margin-top:8px}
#keyscr .field{width:100%}
.logo-lg{width:84px;height:84px;margin-top:8px}
.word{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:12px 0 0}
.word b{color:var(--accent);font-weight:700}
.tag{color:var(--muted);margin:4px 0 26px}
.seg{display:flex;padding:3px;border-radius:14px;gap:2px;width:100%}
.seg button{flex:1;padding:9px 8px;border-radius:11px;color:var(--muted);font-weight:500;font-size:14px;transition:background .25s,color .25s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:rgba(255,255,255,.12);color:var(--fg)}
#authForm{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);padding-left:4px}
.inp{width:100%;height:50px;border-radius:16px;padding:0 16px;background:rgba(255,255,255,.06);border:1px solid var(--line);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.err{min-height:18px;color:var(--bad);font-size:13px;padding-left:4px}
.btn{height:52px;border-radius:17px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--fg)}
.btn.danger{background:rgba(255,92,92,.14);color:var(--bad)}
.linkbtn{color:var(--muted);font-size:14px;padding:12px;margin-top:4px}
.linkbtn:hover{color:var(--fg)}
.note{color:var(--dim);font-size:12px;text-align:center;margin-top:auto;padding-top:20px}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;padding-bottom:112px}
.topbar{display:flex;align-items:center;justify-content:space-between;height:40px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--accent-soft);color:#8db4ff;border:1px solid rgba(47,123,255,.35)}
.brand{display:flex;flex-direction:column;align-items:center;margin-top:4px}
.brand svg{width:54px;height:54px}
.brand .word{font-size:28px;margin-top:8px}
.brand .tag{margin:2px 0 0;font-size:13px}
.stage{flex:1;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.power{--p:clamp(168px,27vh,208px);position:relative;width:var(--p);height:var(--p);border-radius:50%;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.power:active{transform:scale(.93);transition-duration:.12s}
.power .ring,.ripple{will-change:transform}
.power .ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 1.2s linear infinite}
#home[data-state="idle"] .power .ring{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ring .track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:5}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 566;stroke-opacity:0;transition:stroke-dasharray .8s cubic-bezier(.3,.7,.2,1),stroke-opacity .4s}
#home[data-state="connecting"] .arc{stroke-dasharray:150 416;stroke-opacity:1}
#home[data-state="connected"] .arc{stroke-dasharray:566 0;stroke-opacity:1}
.core{position:absolute;inset:13%;border-radius:50%;display:grid;place-items:center;background:rgba(18,23,31,.85);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transition:background .5s,border-color .5s}
.core svg{width:38%;height:38%;stroke-width:2.2;color:#dfe7f3;transition:color .4s,transform .4s}
#home[data-state="connecting"] .core svg{animation:breathe 1s ease-in-out infinite}
#home[data-state="connected"] .core{background:rgba(47,123,255,.14);border-color:rgba(47,123,255,.4);animation:pop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.88)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
#home[data-state="connected"] .core svg{color:#fff}
@keyframes breathe{50%{transform:scale(.86);opacity:.7}}
.ripple{position:absolute;inset:6%;border-radius:50%;border:1.5px solid var(--accent);opacity:0;pointer-events:none}
#home[data-state="connected"] .ripple{animation:ripple 3s ease-out infinite}
#home[data-state="connected"] .ripple.r2{animation-delay:1.5s}
@keyframes ripple{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.5);opacity:0}}
.status{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px}
.status .line{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .3s}
#home[data-state="connecting"] .dot{background:var(--warn);animation:blink 1s infinite}
#home[data-state="connected"] .dot{background:var(--ok)}
#home[data-state="connected"] #stText{color:var(--ok)}
@keyframes blink{50%{opacity:.3}}
.swap{animation:swap .3s ease}
@keyframes swap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.pill{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;text-align:left}
.flag{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;background:rgba(255,255,255,.08);color:#8db4ff}
.flag svg{width:100%;height:100%;display:block}
.flag svg.i{width:18px;height:18px}
.pill .t{flex:1;min-width:0}
.pill .t b{display:block;font-weight:600}
.pill .t span{color:var(--muted);font-size:13px}
.pill .chev{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-radius:20px;padding:12px 4px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.stat small{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:4px}
.stat small svg{width:12px;height:12px;stroke-width:2.4}
.stat b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.ipline{text-align:center;color:var(--dim);font-size:12px;margin-top:10px;min-height:16px}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:20px;right:20px;bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;padding:6px;border-radius:30px;gap:4px;z-index:5;background:var(--glass-2);transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s}
#app.kb .tabbar{transform:translateY(160%);opacity:0;pointer-events:none}
.tabbar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:24px;color:var(--muted);font-size:11px;font-weight:500;transition:background .25s,color .25s}
.tabbar button[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.tabbar button[aria-current="page"] svg{color:var(--accent)}

/* ---------- lists ---------- */
.h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:8px 0 14px}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted);width:20px;height:20px}
.search .inp{padding-left:42px;height:48px;border-radius:15px}
.group{border-radius:22px;overflow:hidden;margin-bottom:16px}
.group-t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;min-height:62px}
.row+.row{border-top:1px solid var(--line)}
.row{transition:background .15s}
.row:active{background:rgba(255,255,255,.06)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.row.sel{background:var(--accent-soft)}
.ping{display:flex;align-items:center;gap:6px}
.ping i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ping.idle i{background:var(--dim)}.ping.warn i{background:var(--warn)}.ping.bad i{background:var(--bad)}
.load{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.load i{display:block;height:100%;background:var(--muted);border-radius:2px}
.fav{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--dim)}
.fav svg{width:19px;height:19px}
.fav[aria-pressed="true"]{color:var(--warn)}
.fav[aria-pressed="true"] svg{fill:var(--warn)}
.lockic{color:var(--muted);width:17px;height:17px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head .round{color:var(--fg);margin-top:2px}
.inp.ta{height:150px;padding:12px 14px;resize:none;line-height:1.4;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
#chat{display:flex;flex-direction:column;overflow:hidden;padding-bottom:104px}
#app.kb #chat{padding-bottom:12px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0 8px;scrollbar-width:none;overscroll-behavior:contain}
.msgs::-webkit-scrollbar{display:none}
.bub{max-width:82%;padding:9px 13px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35}
.bub.mine{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.bub.sup{align-self:flex-start;background:rgba(255,255,255,.09);border-bottom-left-radius:6px}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.bub.fail{background:rgba(255,92,92,.25);cursor:pointer}
.bub.fail small{opacity:1;color:#ffd1d1}
.composer{display:flex;gap:8px;align-items:center;margin-top:8px}
.composer .inp{height:46px;border-radius:23px;flex:1}
.send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.send:active{transform:scale(.86)}
.chat-note{text-align:center;color:var(--muted);font-size:13px;padding:10px 12px;border-radius:16px}
.chat-note a{color:#8db4ff}
.dotb{position:absolute;top:5px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #141a22}
.empty{text-align:center;color:var(--muted);padding:34px 20px}
.autoico{background:var(--accent-soft);color:#8db4ff}

/* ---------- profile ---------- */
.me{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px}
.me .avatar{width:58px;height:58px;font-size:20px}
.me .t{flex:1;min-width:0}
.me .t b{font-size:18px;display:flex;align-items:center;gap:6px}
.me .t span{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--muted)}
.badge.pro{background:var(--accent);color:#fff}
.plan{padding:16px;border-radius:24px;margin-top:12px}
.plan .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan .hd b{font-weight:600}
.plan .hd span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .6s}
.bar i.hot{background:var(--warn)}
.plan p{color:var(--muted);font-size:13px;margin:0 0 14px}
.plan .btn{height:46px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kpi{border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:11px}
.kpi b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.16);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,.8,.3,1);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.row.wrap{flex-wrap:wrap}
.row.wrap .seg{width:100%;margin-top:2px}
.row .seg button{padding:6px 9px;font-size:12px}
.red{color:var(--bad)}
.row .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#b9c4d6;flex:none}
.row .ic svg{width:18px;height:18px}

/* ---------- sheet + toast ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(0,0,0,0);transition:background .3s}
.sheet-wrap.open{background:rgba(0,0,0,.55)}
.sheet{max-height:92%;overflow-y:auto;width:100%;padding:10px 20px max(22px,env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;background:var(--glass-2);transform:translate3d(0,100%,0);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.sheet-wrap.open .sheet{transform:translate3d(0,0,0)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 16px}
.sheet h3{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
.sheet p{margin:0 0 16px;color:var(--muted)}
.sheet .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.code{font-size:36px;font-weight:700;letter-spacing:.14em;text-align:center;font-variant-numeric:tabular-nums;padding:14px 0}
#toast{position:absolute;left:20px;right:20px;top:max(14px,env(safe-area-inset-top,0px));z-index:30;padding:13px 16px;border-radius:18px;background:var(--glass-2);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,.8,.2,1);text-align:center;font-size:14px;pointer-events:none}
#toast.show{transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.500 6v5.500c0 4.600 3.100 8.200 7.500 9.500 4.400-1.300 7.500-4.900 7.500-9.500V6Z"/><path d="m9 12 2.200 2.200L15.200 10"/></symbol>

<script>
(function(){

var $=function(s,r){return (r||document).querySelector(s)};

var reduced=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

function save(){try{localStorage.setItem("nexa.v1",JSON.stringify(DB))}catch(e){}}
function monthKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)}
function deviceName(){var u=navigator.userAgent||"";
  if(/iPhone/.test(u))return "iPhone";if(/iPad/.test(u))return "iPad";if(/Android/.test(u))return "Android";
  if(/Windows/.test(u))return "Windows";if(/Mac/.test(u))return "Mac";if(/Linux/.test(u))return "Linux";return "Это устройство"}
function newData(){return{favs:["am-evn"],custom:[],server:"auto",plan:"free",usage:0,month:monthKey(),
  settings:{auto:false,kill:true,adblock:true,proto:"WireGuard"},history:[],sessions:0,totalSec:0,device:deviceName()}}
function cur(){return DB.data[DB.current]}
function isGuest(){return DB.current==="guest"}
function userName(){return isGuest()?"Гость":(DB.users[DB.current]||{}).name||""}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------- servers ---------- */
var NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function vpn(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.NexaVpn}
var DEMO=[
 {id:"ru-msk",cc:"ru",country:"Россия",city:"Москва",ping:18,load:46,pro:false,lat:55.7,lon:37.6},
 {id:"ru-spb",cc:"ru",country:"Россия",city:"Санкт-Петербург",ping:24,load:33,pro:false,lat:59.9,lon:30.3},
 {id:"am-evn",cc:"am",country:"Армения",city:"Ереван",ping:12,load:28,pro:false,lat:40.2,lon:44.5},
 {id:"kz-ala",cc:"kz",country:"Казахстан",city:"Алматы",ping:49,load:21,pro:false,lat:43.2,lon:76.9},
 {id:"de-fra",cc:"de",country:"Германия",city:"Франкфурт",ping:41,load:62,pro:false,lat:50.1,lon:8.7},
 {id:"nl-ams",cc:"nl",country:"Нидерланды",city:"Амстердам",ping:46,load:55,pro:false,lat:52.4,lon:4.9},
 {id:"fi-hel",cc:"fi",country:"Финляндия",city:"Хельсинки",ping:33,load:18,pro:true,lat:60.2,lon:24.9},
 {id:"tr-ist",cc:"tr",country:"Турция",city:"Стамбул",ping:38,load:40,pro:true,lat:41,lon:29},
 {id:"fr-par",cc:"fr",country:"Франция",city:"Париж",ping:52,load:37,pro:true,lat:48.9,lon:2.4},
 {id:"us-nyc",cc:"us",country:"США",city:"Нью-Йорк",ping:118,load:49,pro:true,lat:40.7,lon:-74},
 {id:"jp-tyo",cc:"jp",country:"Япония",city:"Токио",ping:168,load:26,pro:true,lat:35.7,lon:139.7}
];
var SERVERS=[],BY={},jit={};
function rebuild(){
  var c=(DB.current&&DB.data[DB.current]&&DB.data[DB.current].custom)||[];
  SERVERS=c.map(function(x){return{id:x.id,cc:null,country:"Свой сервер",city:x.name,host:x.host,conf:x.conf,ping:x.ping||0,load:0,pro:false,custom:true,lat:0,lon:0}}).concat(NATIVE?[]:DEMO);
  BY={};SERVERS.forEach(function(s){BY[s.id]=s;if(!(s.id in jit))jit[s.id]=0});
}
function label(s){return s.custom?s.city:s.city+", "+s.country}
function fmtSpd(x){return x<10?x.toFixed(1):String(Math.round(x))}
function pingOf(s){if(s.custom)return Math.round(s.ping||0);return Math.max(5,Math.round(s.ping+jit[s.id]))}
function pingCls(v){return !v?"idle":v<60?"":v<120?"warn":"bad"}
var FLAGS={
 ru:'<rect width="30" height="6.7" fill="#fff"/><rect y="6.7" width="30" height="6.7" fill="#0039a6"/><rect y="13.4" width="30" height="6.7" fill="#d52b1e"/>',
 am:'<rect width="30" height="6.7" fill="#d90012"/><rect y="6.7" width="30" height="6.7" fill="#0033a0"/><rect y="13.4" width="30" height="6.7" fill="#f2a800"/>',
 de:'<rect width="30" height="6.7" fill="#111"/><rect y="6.7" width="30" height="6.7" fill="#dd0000"/><rect y="13.4" width="30" height="6.7" fill="#ffce00"/>',
 nl:'<rect width="30" height="6.7" fill="#ae1c28"/><rect y="6.7" width="30" height="6.7" fill="#fff"/><rect y="13.4" width="30" height="6.7" fill="#21468b"/>',
 fr:'<rect width="10" height="20" fill="#0055a4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ef4135"/>',
 fi:'<rect width="30" height="20" fill="#fff"/><rect x="8" width="4.5" height="20" fill="#003580"/><rect y="7.8" width="30" height="4.5" fill="#003580"/>',
 jp:'<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>',
 tr:'<rect width="30" height="20" fill="#e30a17"/><circle cx="11.500" cy="10" r="5" fill="#fff"/><circle cx="13" cy="10" r="4" fill="#e30a17"/><circle cx="17" cy="10" r="1.700" fill="#fff"/>',
 kz:'<rect width="30" height="20" fill="#00afca"/><circle cx="15" cy="10" r="4" fill="#fec50c"/>',
 us:'<rect width="30" height="20" fill="#fff"/><rect y="0" width="30" height="2.860" fill="#b22234"/><rect y="5.710" width="30" height="2.860" fill="#b22234"/><rect y="11.430" width="30" height="2.860" fill="#b22234"/><rect y="17.140" width="30" height="2.860" fill="#b22234"/><rect width="13" height="11" fill="#3c3b6e"/>'
};
function flagSvg(cc){if(!cc||!FLAGS[cc])return icon("globe","");return '<svg viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+FLAGS[cc]+'</svg>'}
function autoIco(){return '<svg class="i"><use href="#i-bolt"/></svg>'}
function icon(n,cls){return '<svg class="i '+(cls||"")+'"><use href="#i-'+n+'"/></svg>'}

/* ---------- format ---------- */
function pad(n){return n<10?"0"+n:""+n}
function fmtTime(s){return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function fmtBytes(b){return b>=GB?(b/GB).toFixed(2)+" ГБ":Math.max(0,Math.round(b/1048576))+" МБ"}
function fmtDur(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+" ч "+pad(m)+" мин":(m||(s?1:0))+" мин"}
function fmtDate(t){try{return new Date(t).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}

/* ---------- toast / sheet ---------- */
var tt;
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2600)}
function openSheet(html,bind){
  var w=$("#sheetWrap"),s=$("#sheet");
  s.innerHTML='<div class="grab"></div>'+html;w.hidden=false;
  requestAnimationFrame(function(){w.classList.add("open")});
  if(bind)bind(s);
  var f=$("input,button",s);if(f&&f.tagName==="INPUT")setTimeout(function(){f.focus()},350)
}
function closeSheet(){var w=$("#sheetWrap");w.classList.remove("open");setTimeout(function(){w.hidden=true},300)}
$("#sheetWrap").addEventListener("click",function(e){if(e.target.id==="sheetWrap")closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#sheetWrap").hidden)closeSheet()});
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}

/* ---------- auth ---------- */
var mode="login";
function setMode(m){
  mode=m;
  $("#tabLogin").setAttribute("aria-selected",m==="login");
  $("#tabReg").setAttribute("aria-selected",m==="register");
  $("#fName").hidden=m==="login";
  $("#authBtn").textContent=m==="login"?"Войти":"Создать аккаунт";
  $("#inPass").autocomplete=m==="login"?"current-password":"new-password";
  $("#authErr").textContent="";
}
$("#tabLogin").onclick=function(){setMode("login")};
$("#tabReg").onclick=function(){setMode("register")};
function hash(email,pw){
  try{
    var enc=new TextEncoder().encode("nexa:"+email+":"+pw);
    return crypto.subtle.digest("SHA-256",enc).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")});
  }catch(e){return Promise.resolve(btoa(unescape(encodeURIComponent(email+":"+pw))))}
}
$("#authForm").addEventListener("submit",function(e){
  e.preventDefault();
  var name=$("#inName").value.trim(),email=$("#inEmail").value.trim().toLowerCase(),pw=$("#inPass").value,err=$("#authErr");
  if(mode==="register"&&name.length<2){err.textContent="Введите имя, минимум 2 символа.";return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){err.textContent="Проверьте адрес почты, например name@mail.com.";return}
  if(pw.length<6){err.textContent="Пароль должен быть не короче 6 символов.";return}
  hash(email,pw).then(function(h){
    if(mode==="register"){
      if(DB.users[email]){err.textContent="Эта почта уже зарегистрирована. Выберите «Вход».";return}
      DB.users[email]={name:name,hash:h,created:Date.now()};DB.data[email]=newData();
    }else{
      var u=DB.users[email];
      if(!u||u.hash!==h){err.textContent="Неверная почта или пароль.";return}
    }
    DB.current=email;save();$("#inPass").value="";enterApp();
  });
});
$("#guestBtn").onclick=function(){DB.current="guest";if(!DB.data.guest)DB.data.guest=newData();save();enterApp()};

/* ---------- state ---------- */
var st={status:"idle",active:null,startedAt:0,bytes:0,down:0,up:0,ip:"",timers:[],attempt:0,probeT:0,lastRx:0,lastTx:0};
function isPro(){return cur().plan==="premium"}
function canUse(s){return !s.pro||isPro()}
function best(){
  var list=SERVERS.filter(canUse).sort(function(a,b){return pingOf(a)-pingOf(b)});return list[0]
}
function selected(){var d=cur();return d.server==="auto"?null:BY[d.server]}

function enterApp(){
  var d=cur();d.custom=d.custom||[];rebuild();
  if(d.month!==monthKey()){d.month=monthKey();d.usage=0}
  if(!canUse(BY[d.server]||{pro:false})&&d.server!=="auto")d.server="auto";
  $("#app").dataset.mode="main";$("#auth").hidden=true;$("#keyscr").hidden=true;$("#main").hidden=false;
  go("home");paintHome();
  if(d.settings.auto)setTimeout(function(){if(st.status==="idle"&&DB.current)connect()},900);
}
function showAuth(m){
  disconnect(true);DB.current=null;save();
  $("#app").dataset.mode="auth";$("#main").hidden=true;$("#keyscr").hidden=true;$("#auth").hidden=false;$("#app").dataset.tab="home";setMode(m||"login");
}

/* ---------- navigation ---------- */
function go(tab){
  $("#app").classList.remove("kb");
  $("#app").dataset.tab=tab;
  ["home","servers","chat","profile"].forEach(function(t){
    var el=$("#"+t);el.hidden=t!==tab;
    if(t===tab){el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter")}
  });
  $$(".tabbar button").forEach(function(b){if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(tab==="servers")renderServers();
  if(tab==="chat")renderChat();
  if(tab==="profile")renderProfile();
  if(tab==="home")paintHome();
}
$$(".tabbar button").forEach(function(b){b.onclick=function(){go(b.dataset.tab)}});

/* ---------- connection ---------- */
var STAGES=["Поиск сервера…","Рукопожатие…","Шифрование канала…"];
function setStatus(t){var el=$("#stText");if(el.textContent===t)return;el.textContent=t;el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap")}
function clearTimers(){st.timers.forEach(clearTimeout);st.timers=[]}
function toggle(){
  buzz();
  if(st.status==="idle")connect();
  else if(st.status==="connecting"){disconnect()}
  else disconnect();
}
$("#power").onclick=toggle;
function connect(){
  var d=cur();
  var s=selected()||best();
  if(!s){openAddServer();return}
  if(!s.custom&&!isPro()&&d.usage>=LIMIT){toast("Лимит 10 ГБ исчерпан. Включите Premium или дождитесь нового месяца.");return}
  st.active=s.id;st.status="connecting";var my=++st.attempt;paintHome();
  if(s.custom){connectReal(s,my);return}
  var proto=d.settings.proto;
  setStatus(STAGES[0]);
  st.timers.push(setTimeout(function(){setStatus(proto==="WireGuard"?"Рукопожатие WireGuard…":"Рукопожатие "+proto+"…")},900));
  st.timers.push(setTimeout(function(){setStatus(STAGES[2])},1800));
  st.timers.push(setTimeout(function(){
    st.status="connected";st.startedAt=Date.now();st.bytes=0;
    var base=Math.max(24,200-pingOf(s)*0.9);st.down=base;st.up=base*0.5;
    st.ip=[185,Math.floor(40+Math.random()*180),Math.floor(Math.random()*250),Math.floor(2+Math.random()*250)].join(".");
    buzz();paintHome();toast("Подключено: "+label(s));
  },2700));
}
function probe(ms){
  return new Promise(function(res,rej){
    var t0=performance.now(),done=false,tm=setTimeout(function(){if(!done){done=true;rej(new Error("probe"))}},ms);
    fetch("https://1.1.1.1/cdn-cgi/trace",{cache:"no-store"}).then(function(r){return r.text()}).then(function(tx){
      if(done)return;done=true;clearTimeout(tm);var m=/ip=(\S+)/.exec(tx);res({ms:Math.max(1,Math.round(performance.now()-t0)),ip:m&&m[1]});
    }).catch(function(){if(done)return;done=true;clearTimeout(tm);rej(new Error("probe"))});
  });
}
function connectReal(s,my){
  var v=vpn();
  if(!v){st.status="idle";paintHome();toast("Туннель работает только в приложении на телефоне. В браузере это демо.");return}
  setStatus("Запрос разрешения…");
  v.connect({config:s.conf}).then(function(){
    if(st.attempt!==my||st.status!=="connecting"){v.disconnect().catch(function(){});return}
    setStatus("Проверка канала…");
    return probe(8000).then(function(r){
      if(st.attempt!==my||st.status!=="connecting"){v.disconnect().catch(function(){});return}
      st.status="connected";st.startedAt=Date.now();st.bytes=0;st.down=st.up=0;st.lastRx=st.lastTx=0;st.probeT=Date.now();
      st.ip=r.ip||"—";s.ping=r.ms;
      buzz();paintHome();toast("Подключено: "+label(s));
    });
  }).catch(function(e){
    if(st.attempt!==my)return;
    v.disconnect().catch(function(){});
    st.status="idle";paintHome();
    toast(e&&e.message==="probe"?"Туннель поднят, но сервер не отвечает. Проверьте конфигурацию и UDP-порт на сервере.":"Не удалось подключиться: "+((e&&e.message)||"ошибка"));
  });
}
var probing=false;
function realTick(s){
  var v=vpn();if(!v)return;
  v.getStats().then(function(r){
    var rx=r.rx||0,tx=r.tx||0;
    if(st.lastRx||st.lastTx){st.down=st.down*0.5+Math.max(0,rx-st.lastRx)*8/1e6*0.5;st.up=st.up*0.5+Math.max(0,tx-st.lastTx)*8/1e6*0.5}
    st.lastRx=rx;st.lastTx=tx;st.bytes=rx+tx;paintLive();
  }).catch(function(){});
  if(!probing&&Date.now()-st.probeT>5000){
    probing=true;st.probeT=Date.now();
    probe(6000).then(function(r){s.ping=r.ms;if(r.ip)st.ip=r.ip}).catch(function(){}).then(function(){probing=false});
  }
}
function disconnect(silent){
  clearTimers();st.attempt++;
  var cs=BY[st.active];
  if(cs&&cs.custom&&st.status!=="idle"){var vv=vpn();if(vv)vv.disconnect().catch(function(){})}
  if(st.status==="connected"&&DB.current){
    var d=cur(),dur=Math.max(1,Math.round((Date.now()-st.startedAt)/1000)),s=BY[st.active];
    d.history.unshift({id:s.id,t:st.startedAt,dur:dur,bytes:Math.round(st.bytes),n:label(s),cc:s.cc||null});
    d.history=d.history.slice(0,20);d.sessions++;d.totalSec+=dur;save();
  }
  st.status="idle";st.down=st.up=0;
  if(!silent){paintHome();if($("#app").dataset.tab==="profile")renderProfile()}
}
function reconnectIfNeeded(){
  if(st.status!=="idle"){var was=st.status;disconnect(true);paintHome();connect()}
}

/* live tick */
setInterval(function(){
  SERVERS.forEach(function(s){jit[s.id]=Math.max(-8,Math.min(8,jit[s.id]*0.6+(Math.random()-0.5)*7))});
  if(DB.current&&st.status==="connected"&&BY[st.active]&&BY[st.active].custom){realTick(BY[st.active])}
  else if(DB.current&&st.status==="connected"){
    var d=cur(),s=BY[st.active],base=Math.max(24,200-pingOf(s)*0.9);
    st.down+=(base-st.down)*0.25+(Math.random()-0.5)*base*0.16;

    st.down=Math.max(5,st.down);st.up=Math.max(2,st.up);
    var b=(0.15+Math.random()*1.1)*1048576;st.bytes+=b;d.usage+=b;
    if(Math.round(Date.now()/1000)%5===0)save();
    paintLive();
    if(!isPro()&&d.usage>=LIMIT){disconnect();toast("Лимит 10 ГБ исчерпан. Соединение остановлено.")}
  }
  if(DB.current&&$("#app").dataset.tab==="profile")updateProfileLive();
  if(DB.current&&$("#app").dataset.tab==="servers")$$("[data-ping]").forEach(function(el){

  });

function parseWg(t){
  var g=function(k){var m=new RegExp("^\\s*"+k+"\\s*=\\s*(.+?)\\s*$","mi").exec(t);return m?m[1]:""};
  var key=/^[A-Za-z0-9+\/]{43}=$/;
  if(!key.test(g("PrivateKey")))return{err:"В конфигурации нет PrivateKey или он повреждён."};
  if(!g("Address"))return{err:"В конфигурации нет строки Address."};
  if(!key.test(g("PublicKey")))return{err:"В конфигурации нет PublicKey сервера."};
  var m=/^(\[[^\]]+\]|[^:]+):(\d{1,5})$/.exec(g("Endpoint"));
  if(!m)return{err:"Endpoint должен быть в виде адрес:порт."};
  return{host:m[1]+":"+m[2]};
}
function b64dec(t){
  t=t.replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";
  var bin=atob(t);try{return decodeURIComponent(escape(bin))}catch(e){return bin}
}
function splitConfs(text,name){
  var parts=text.split(/(?=^[ \t]*\[Interface\])/mi).filter(function(x){return /\[Interface\]/i.test(x)}),out=[];
  parts.forEach(function(c){
    c=c.trim();var p=parseWg(c);if(p.err)return;
    var nm=/^#\s*name\s*[=:]\s*(.+)$/mi.exec(c);
    out.push({name:(nm&&nm[1].trim())||(name&&parts.length===1?name:p.host.replace(/:\d+$/,"")),conf:c,host:p.host});
  });
  return out;
}
function importKey(raw,hint){
  raw=(raw||"").trim();
  if(!raw)return Promise.reject(new Error("Вставьте ключ."));
  var done=function(t){var l=splitConfs(t,hint||"");if(!l.length)throw new Error("В ключе нет рабочей конфигурации WireGuard.");return l};
  try{
    if(/^nexavpn:\/\//i.test(raw)){
      var body=raw.replace(/^nexavpn:\/\//i,""),fr="",h=body.indexOf("#");
      if(h>=0){try{fr=decodeURIComponent(body.slice(h+1))}catch(e){}body=body.slice(0,h)}
      if(!hint&&fr)hint=fr;
      return Promise.resolve(done(b64dec(body.replace(/\/+$/,""))));
    }
    if(/^https?:\/\//i.test(raw)){
      return fetch(raw,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("Сервер ключа ответил ошибкой "+r.status+".");return r.text()},
        function(){throw new Error("Не удалось загрузить ключ по ссылке. Проверьте адрес и интернет.")})
        .then(function(t){if(!/\[Interface\]/i.test(t)){try{t=b64dec(t)}catch(e){}}return done(t)});
    }
    if(/\[Interface\]/i.test(raw))return Promise.resolve(done(raw));
    return Promise.resolve(done(b64dec(raw)));
  }catch(e){
    return Promise.reject(new Error(e&&e.message&&e.name==="Error"&&e.message.indexOf("В ключе")===0?e.message:"Не удалось распознать ключ. Проверьте, что скопировали его целиком."));
  }
}
function addServers(list){
  var d=cur();d.custom=d.custom||[];var first=null,n=0;
  list.forEach(function(x){
    if(d.custom.some(function(c){return c.conf===x.conf}))return;
    var id="c-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    d.custom.push({id:id,name:x.name,conf:x.conf,host:x.host});if(!first)first=id;n++;
  });
  if(first)d.server=first;save();rebuild();return n;
}

   '<button class="row" data-act="device"><span class="ic">'+icon("plus","")+'</span><span class="t"><b>Привязать устройство</b></span>'+icon("right","")+'</button></div>';
  h+='<div class="group-t">История подключений</div>';
  if(!d.history.length)h+='<div class="group glass"><div class="empty">Пока пусто. Подключитесь, и сессия появится здесь.</div></div>';
  else h+='<div class="group glass">'+d.history.slice(0,6).map(function(x){var s=BY[x.id]||DEMO.filter(function(z){return z.id===x.id})[0],nm=x.n||(s?label(s):"Сервер"),cc=x.cc!==undefined?x.cc:(s&&s.cc);
    return '<div class="row"><span class="flag">'+flagSvg(cc)+'</span><span class="t"><b>'+esc(nm)+'</b><span>'+fmtDate(x.t)+'</span></span><span class="r" style="flex-direction:column;align-items:flex-end;gap:0"><span>'+fmtDur(x.dur)+'</span><span>'+fmtBytes(x.bytes)+'</span></span></div>'}).join("")+'</div>';
  h+='<div class="group-t">Аккаунт</div><div class="group glass">'+
   '<button class="row" data-act="logout"><span class="ic">'+icon("out","red")+'</span><span class="t"><b class="red">Выйти</b></span></button>'+
   (isGuest()?"":'<button class="row" data-act="delete"><span class="ic">'+icon("trash","red")+'</span><span class="t"><b class="red">Удалить аккаунт</b></span></button>')+'</div>';
  var v=$("#profile"),top=v.scrollTop;v.innerHTML=h;v.scrollTop=top;
}
$("#profile").addEventListener("click",function(e){
  var d=cur(),t;
  if(t=e.target.closest("[data-sw]")){var k=t.dataset.sw;d.settings[k]=!d.settings[k];save();t.setAttribute("aria-checked",d.settings[k]);return}
  if(t=e.target.closest("[data-proto]")){
    if(d.settings.proto===t.dataset.proto)return;d.settings.proto=t.dataset.proto;save();renderProfile();paintHome();
    if(st.status!=="idle"){reconnectIfNeeded();toast("Протокол: "+d.settings.proto)}return}
  if(!(t=e.target.closest("[data-act]")))return;
  var a=t.dataset.act;
  if(a==="pro")setPlan("premium");
  else if(a==="free")setPlan("free");
  else if(a==="signup"){showAuth("register")}
  else if(a==="name"){
    openSheet('<h3>Изменить имя</h3><div class="field" style="margin-top:12px"><label for="nm">Имя</label><input class="inp" id="nm" value="'+esc(userName())+'" maxlength="40"></div><div class="btns"><button class="btn primary" data-a="ok">Сохранить</button><button class="btn ghost" data-a="no">Отмена</button></div>',function(s){
      $("[data-a=no]",s).onclick=closeSheet;
      $("[data-a=ok]",s).onclick=function(){var v=$("#nm").value.trim();if(v.length<2){toast("Имя слишком короткое");return}
        DB.users[DB.current].name=v;save();closeSheet();renderProfile();paintHome()}})}
  else if(a==="device"){
    var lim=isPro()?5:2,code=String(Math.floor(100000+Math.random()*900000));code=code.slice(0,3)+" "+code.slice(3);
    openSheet('<h3>Привязка устройства</h3><p>Введите этот код в NexaVPN на другом устройстве. Код действует 5 минут. На вашем тарифе доступно устройств: '+lim+'.</p><div class="code glass" style="border-radius:20px">'+code+'</div><div class="btns"><button class="btn ghost" data-a="no">Готово</button></div>',function(s){$("[data-a=no]",s).onclick=closeSheet})}
  else if(a==="logout"){
    openSheet('<h3>Выйти из аккаунта?</h3><p>Соединение будет остановлено. Данные сохранятся на этом устройстве.</p><div class="btns"><button class="btn danger" data-a="ok">Выйти</button><button class="btn ghost" data-a="no">Отмена</button></div>',function(s){
      $("[data-a=no]",s).onclick=closeSheet;$("[data-a=ok]",s).onclick=function(){closeSheet();showAuth("login")}})}
  else if(a==="delete"){
    openSheet('<h3>Удалить аккаунт?</h3><p>Профиль, настройки и история подключений будут стёрты без возможности восстановления.</p><div class="btns"><button class="btn danger" data-a="ok">Удалить навсегда</button><button class="btn ghost" data-a="no">Отмена</button></div>',function(s){
      $("[data-a=no]",s).onclick=closeSheet;
      $("[data-a=ok]",s).onclick=function(){var em=DB.current;disconnect(true);delete DB.users[em];delete DB.data[em];DB.current=null;save();closeSheet();showAuth("register");toast("Аккаунт удалён")}})}
});
function updateProfileLive(){
  var d=cur(),live=st.status==="connected"?Math.floor((Date.now()-st.startedAt)/1000):0,e;
  if(e=$("#pUsed"))e.textContent=fmtBytes(d.usage)+" из 10 ГБ";
  if(e=$("#pBar"))e.style.width=Math.min(100,d.usage/LIMIT*100)+"%";
  if(e=$("#kTime"))e.textContent=fmtDur(d.totalSec+live);
  if(e=$("#kMonth"))e.textContent=fmtBytes(d.usage);
  if(e=$("#kSess"))e.textContent=d.sessions+(live?1:0);
}


/* ---------- key screen ---------- */
var CFG={support:"",bot:"",tg:""};
function showKey(){
  $("#app").dataset.mode="key";$("#auth").hidden=true;$("#main").hidden=true;$("#keyscr").hidden=false;
  if(CFG.bot){var a=$("#keyBuy");a.href=CFG.bot;a.hidden=false}
}
$("#keyBtn").onclick=function(){
  var b=this;$("#keyErr").textContent="";b.disabled=true;
  importKey($("#keyIn").value).then(function(list){
    DB.keyShown=true;
    if(!DB.current)DB.current="guest";
    if(!DB.data[DB.current])DB.data[DB.current]=newData();
    addServers(list);save();$("#keyIn").value="";enterApp();toast("Ключ добавлен");
  }).catch(function(e){$("#keyErr").textContent=e.message||"Не удалось добавить ключ."}).then(function(){b.disabled=false});
};
$("#keyPaste").onclick=function(){
  var f=function(){$("#keyIn").focus()};
  try{navigator.clipboard.readText().then(function(t){$("#keyIn").value=t}).catch(f)}catch(e){f()}
};
$("#keyAcc").onclick=function(){DB.keyShown=true;save();showAuth("login")};
$("#toKey").onclick=function(){showKey()};

/* ---------- deep link nexavpn://... ---------- */
function deepKey(k){
  importKey(k).then(function(list){
    DB.keyShown=true;
    var fresh=!DB.current;
    if(fresh)DB.current="guest";
    if(!DB.data[DB.current])DB.data[DB.current]=newData();
    var n=addServers(list);save();
    if(fresh||$("#app").dataset.mode!=="main")enterApp();else refreshAfterKey();
    toast(n?"Ключ добавлен":"Этот ключ уже добавлен");
  }).catch(function(e){toast(e.message)});
}
function checkPending(){
  var v=vpn();if(!v||!v.takeKey)return;
  v.takeKey().then(function(r){if(r&&r.key)deepKey(r.key)}).catch(function(){});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkPending()});

/* ---------- support chat ---------- */
var chat={msgs:[],last:0};
try{var cr=JSON.parse(localStorage.getItem("nexa.chat"));if(cr&&cr.msgs)chat=cr}catch(e){}
function saveChat(){try{localStorage.setItem("nexa.chat",JSON.stringify({msgs:chat.msgs.slice(-200),last:chat.last}))}catch(e){}}
function devId(){
  if(!DB.device){DB.device=(Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,24);save()}
  return DB.device;
}
function supportBase(){
  if(CFG.support)return CFG.support.replace(/\/+$/,"");
  var d=DB.current&&DB.data[DB.current],list=d&&d.custom||[];
  var c=list.filter(function(x){return x.id===d.server})[0]||list[0];
  return c?"http://"+c.host.replace(/:\d+$/,"")+":8080":"";
}
function chatTime(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())}
function scrollMsgs(){var b=$("#msgs");if(b)b.scrollTop=b.scrollHeight}
function drawMsgs(){
  var box=$("#msgs");if(!box)return;
  var h='<div class="bub sup">Здравствуйте! Опишите вопрос, и мы ответим прямо здесь.</div>';
  if(!supportBase())h+='<div class="chat-note glass">Чат подключится после добавления ключа.'+(CFG.tg?' Пока можно написать нам в <a href="'+CFG.tg+'" target="_blank" rel="noopener">Telegram</a>.':'')+'</div>';
  h+=chat.msgs.map(function(m,i){
    var fail=m.st==="fail";
    return '<div class="bub '+(m.from==="me"?"mine":"sup")+(fail?" fail":"")+'"'+(fail?' data-retry="'+i+'" role="button" tabindex="0"':"")+'>'+esc(m.text)+'<small>'+(m.st==="sending"?"Отправляется…":fail?"Не отправлено. Нажмите, чтобы повторить":chatTime(m.ts))+'</small></div>';
  }).join("");
  box.innerHTML=h;scrollMsgs();
  $$("[data-retry]",box).forEach(function(el){el.onclick=function(){retryMsg(+el.dataset.retry)}});
}
function renderChat(){
  var v=$("#chat");$("#chatDot").hidden=true;
  if(!v.dataset.ready){
    v.dataset.ready="1";
    v.innerHTML='<h1 class="h1">Поддержка</h1><div class="msgs" id="msgs" aria-live="polite"></div>'+
      '<form class="composer" id="cform"><input class="inp" id="cin" autocomplete="off" maxlength="1000" placeholder="Сообщение" aria-label="Сообщение"><button class="send" id="csend" type="submit" aria-label="Отправить">'+icon("up","")+'</button></form>';
    $("#cform").onsubmit=function(e){e.preventDefault();sendChat()};
    $("#csend").onmousedown=function(e){e.preventDefault()};
    $("#cin").onfocus=function(){$("#app").classList.add("kb");setTimeout(scrollMsgs,300)};
    $("#cin").onblur=function(){$("#app").classList.remove("kb")};
    $("#msgs").addEventListener("pointerdown",function(){$("#cin").blur()});
  }
  drawMsgs();pollChat();
}
function postMsg(m){
  var base=supportBase();
  if(!base){m.st="fail";saveChat();drawMsgs();return}
  m.st="sending";
  fetch(base+"/api/support/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:devId(),text:m.text})})
    .then(function(r){if(!r.ok)throw 0;m.st="sent"}).catch(function(){m.st="fail"}).then(function(){saveChat();drawMsgs()});
}
function sendChat(){
  var inp=$("#cin"),t=inp.value.trim();if(!t)return;
  inp.value="";var m={from:"me",text:t,ts:Date.now(),st:"sending"};
  chat.msgs.push(m);saveChat();drawMsgs();postMsg(m);
}
function retryMsg(i){var m=chat.msgs[i];if(m){m.st="sending";drawMsgs();postMsg(m)}}
var polling=false;
function pollChat(){
  var base=supportBase();if(!base||polling||!chat.msgs.length)return;
  polling=true;
  fetch(base+"/api/support/poll?device="+encodeURIComponent(devId())+"&after="+chat.last,{cache:"no-store"})
    .then(function(r){return r.json()}).then(function(j){
      var n=0;(j.messages||[]).forEach(function(x){chat.last=Math.max(chat.last,x.id);chat.msgs.push({from:"sup",text:x.text,ts:x.ts*1000,st:"sent"});n++});
      if(n){saveChat();if($("#app").dataset.tab==="chat")drawMsgs();else{$("#chatDot").hidden=false;toast("Ответ от поддержки")}}
    }).catch(function(){}).then(function(){polling=false});
}
var pollN=0;
setInterval(function(){if(!DB.current)return;pollN++;if($("#app").dataset.tab==="chat"||pollN%5===0)pollChat()},4000);

/* ---------- globe ---------- */
var cv=$("#globe"),cx=cv.getContext("2d"),W=0,H=0,pts=[];
for(var la=-78;la<=78;la+=6){var r=Math.cos(la*Math.PI/180),n=Math.max(6,Math.round(64*r));
  for(var k=0;k<n;k++)pts.push([la*Math.PI/180,k/n*Math.PI*2])}
var NODES=DEMO.filter(function(s){return ["ru-msk","am-evn","de-fra","nl-ams","fi-hel","tr-ist"].indexOf(s.id)>=0});
function resize(){var r=$("#app").getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,1.5);
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener("resize",resize);resize();
var TILT=0.62,sT=Math.sin(TILT),cT=Math.cos(TILT);
function proj(lat,lon,rot,R,cxp,cyp){
  var x=Math.cos(lat)*Math.sin(lon+rot),y=Math.sin(lat),z=Math.cos(lat)*Math.cos(lon+rot);
  var y2=y*cT-z*sT,z2=y*sT+z*cT;return{x:cxp+x*R,y:cyp-y2*R,z:z2}}
var bk=[[],[],[],[],[],[]],lastDraw=0;
function draw(t){
  cx.clearRect(0,0,W,H);
  var R=W*1.12,cxp=W/2,cyp=H*0.6+R,rot=reduced?0.4:t*0.00006+0.4;
  cx.fillStyle="rgba(4,7,11,.0)";
  for(var b=0;b<6;b++)bk[b].length=0;
  for(var i=0;i<pts.length;i++){
    var p=proj(pts[i][0],pts[i][1],rot,R,cxp,cyp);
    if(p.z<=0||p.y<0||p.y>H)continue;
    var bi=Math.min(5,Math.floor(Math.pow(p.z,1.4)*6));
    bk[bi].push(p.x-.6,p.y-.6);
  }
  for(var b2=0;b2<6;b2++){
    cx.fillStyle="rgba(130,175,255,"+(.1+b2*.1).toFixed(2)+")";
    var arr=bk[b2];for(var k2=0;k2<arr.length;k2+=2)cx.fillRect(arr[k2],arr[k2+1],1.4,1.4);
  }
  cx.strokeStyle="rgba(47,123,255,.55)";cx.lineWidth=1.4;cx.beginPath();cx.arc(cxp,cyp,R,0,Math.PI*2);cx.stroke();
  cx.strokeStyle="rgba(47,123,255,.14)";cx.lineWidth=6;cx.stroke();
  var pr=NODES.map(function(s){return proj(s.lat*Math.PI/180,s.lon*Math.PI/180,rot,R,cxp,cyp)});
  var on=DB.current&&st.status==="connected";
  if(on){
    cx.lineWidth=1.2;
    for(var j=0;j<pr.length-1;j++){var a1=pr[j],b1=pr[j+1];if(a1.z<=0||b1.z<=0)continue;
      var mx=(a1.x+b1.x)/2,my=(a1.y+b1.y)/2,qx=mx+(mx-cxp)*.22,qy=my+(my-cyp)*.22;
      cx.strokeStyle="rgba(80,150,255,.55)";cx.beginPath();cx.moveTo(a1.x,a1.y);cx.quadraticCurveTo(qx,qy,b1.x,b1.y);cx.stroke();
      if(!reduced){var u=(t*0.0004+j*.31)%1,ix=(1-u)*(1-u)*a1.x+2*(1-u)*u*qx+u*u*b1.x,iy=(1-u)*(1-u)*a1.y+2*(1-u)*u*qy+u*u*b1.y;
        cx.fillStyle="#9cc3ff";cx.beginPath();cx.arc(ix,iy,2,0,Math.PI*2);cx.fill()}}}
  pr.forEach(function(p,i){if(p.z<=0||p.y<0||p.y>H)return;
    var pulse=reduced?0:(Math.sin(t*0.003+i)+1)/2;
    cx.fillStyle="rgba(47,123,255,"+(.18+.18*pulse).toFixed(2)+")";cx.beginPath();cx.arc(p.x,p.y,5+pulse*3,0,Math.PI*2);cx.fill();
    cx.fillStyle="#4f95ff";cx.beginPath();cx.arc(p.x,p.y,2.4,0,Math.PI*2);cx.fill()});
}
function loop(t){
  var gap=$("#app").dataset.tab==="home"?15:50;
  if(!document.hidden&&t-lastDraw>=gap){lastDraw=t;draw(t)}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- boot ---------- */
setMode("login");
checkPending();
if(NATIVE&&vpn())vpn().disconnect().catch(function(){});
if(DB.current&&(DB.current==="guest"?DB.data.guest:DB.users[DB.current]&&DB.data[DB.current])){enterApp()}
else{DB.current=null;if(!DB.keyShown)showKey()}
})();
</script>
