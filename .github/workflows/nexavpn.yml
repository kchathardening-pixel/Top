name: NexaVPN APK
on:
  push:
    branches: [ nexavpn ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexavpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npx cap add android
      - name: Native VPN module
        run: |
          D=android/app/src/main/java/ru/nexavpn/app
          mkdir -p $D
          cp native/NexaVpnPlugin.java native/MainActivity.java $D/
          python3 - <<'PY'
          p='android/app/build.gradle'
          s=open(p).read()
          if 'compileOptions {' in s:
              s=s.replace('compileOptions {','compileOptions {\n        coreLibraryDesugaringEnabled true',1)
          else:
              s=s.replace('\nandroid {\n','\nandroid {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n',1)
          s=s.replace('\ndependencies {\n','\ndependencies {\n    implementation "com.wireguard.android:tunnel:1.0.20230706"\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n',1)
          open(p,'w').write(s)
          m='android/app/src/main/AndroidManifest.xml'
          x=open(m).read()
          x=x.replace('<application','<application android:usesCleartextTraffic="true"',1)
          flt='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="nexavpn"/></intent-filter>'
          x=x.replace('</activity>',flt+'</activity>',1)
          open(m,'w').write(x)
          PY
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          OUT=android/app/build/outputs/apk/release
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > ks.jks
            PASS=${KS_PASS:-youchat-ks}
            $BT/zipalign -p -f 4 $OUT/app-release-unsigned.apk aligned.apk
            KS_PASS_ENV="$PASS" $BT/apksigner sign --ks ks.jks --ks-key-alias youchat --ks-pass env:KS_PASS_ENV --key-pass env:KS_PASS_ENV --out NexaVPN.apk aligned.apk
            rm -f ks.jks
          else
            echo "Нет KEYSTORE_B64, собираю debug"
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk NexaVPN.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NexaVPN-apk
          path: nexavpn/NexaVPN.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexavpn-${{ github.run_number }}
          name: NexaVPN (сборка ${{ github.run_number }})
          files: nexavpn/NexaVPN.apk
          make_latest: false
