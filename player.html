<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin"><title>RUSH TV</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}p{color:#fff;font:15px system-ui;text-align:center;margin-top:40vh}</style></head>
<body><script>
(function(){var q=new URLSearchParams(location.search),v=q.get('v')||'',t=Math.max(0,parseInt(q.get('t')||'0',10)||0);
if(!/^[\w-]{11}$/.test(v)){document.body.innerHTML='<p>Нет видео</p>';return}
var f=document.createElement('iframe');f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;
f.referrerPolicy='strict-origin-when-cross-origin';
f.src='https://www.youtube.com/embed/'+v+'?autoplay=1&playsinline=1&rel=0&modestbranding=1&origin='+encodeURIComponent(location.origin)+(t>2?'&start='+t:'');
document.body.appendChild(f)})();
</script></body></html>
