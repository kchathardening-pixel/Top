}

/* ---------- uploads ---------- */
function compress(file,max,keepAlpha){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const png=keepAlpha;c.toBlob(b=>b?res({blob:b,ext:png?"png":"jpg",type:png?"image/png":"image/jpeg"}):rej(new Error("Не удалось обработать изображение")),png?"image/png":"image/jpeg",.85)};img.onerror=()=>rej(new Error("Не удалось открыть изображение"));img.src=url})}
async function upload(file,folder,max,keepAlpha){
  const {blob,ext,type}=await compress(file,max,keepAlpha);
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from("besto").upload(path,blob,{contentType:type,cacheControl:"31536000"});
  if(error)throw error;
  return sb.storage.from("besto").getPublicUrl(path).data.publicUrl;
}
let pickCb=null;
function pick(cb){pickCb=cb;$("file").click()}
$("file").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f||!pickCb)return;const cb=pickCb;pickCb=null;toast("Загрузка…","upload");try{await cb(f)}catch(err){toast(errMsg(err),"info")}});

  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
  try{switch(a){
   case "tab":S.tab=id;if(S.sheet)closeSheet();if(id!=="home"&&id!=="catalog")S.q="";render();window.scrollTo(0,0);if(id==="profile"&&S.user)loadMine().then(()=>S.tab==="profile"&&render());break;
   case "cat":S.cat=id||null;if(t.dataset.go){S.tab="home";S.q=""}render();break;
   case "open":if(byId(id))openSheet(id);break;
   case "closeSheet":closeSheet();break;
   case "fav":e.stopPropagation();{const on=!S.fav.includes(id);S.fav=on?[...S.fav,id]:S.fav.filter(x=>x!==id);save("besto_fav",S.fav);toast(on?"Добавлено в избранное":"Удалено из избранного","heart");render()}break;
   case "add":S.cart[id]=(S.cart[id]||0)+1;save("besto_cart",S.cart);toast("Товар в корзине","check");render();break;
   case "goCart":closeSheet();S.tab="cart";render();window.scrollTo(0,0);break;
   case "inc":{const p=byId(id);if(p&&S.cart[id]>=p.stock){toast("Больше нет в наличии","info");break}S.cart[id]++;save("besto_cart",S.cart);render();break}
   case "dec":S.cart[id]--;if(S.cart[id]<=0)delete S.cart[id];save("besto_cart",S.cart);render();break;
   case "share":{const url=location.href.split("#")[0]+"#p-"+id;try{if(navigator.share)await navigator.share({title:byId(id).title,url});else{await navigator.clipboard.writeText(url);toast("Ссылка скопирована","check")}}catch(x){}break}
   case "auth":authBox("login");break;
   case "authMode":authBox(S.authMode==="login"?"register":"login");break;
   case "closeModal":closeModal();break;
   case "confirmYes":{const cb=S.modal;closeModal();if(cb)await cb();break}
   case "logout":await sb.auth.signOut();toast("Вы вышли из аккаунта","logout");break;
   case "claim":{const {data,error}=await sb.rpc("besto_claim_admin");if(error)throw error;if(data){toast("Вы администратор магазина","shield");await refreshRole();openAdmin()}else{S.hasAdmin=true;toast("Администратор уже назначен","info");render()}break}
   case "admin":openAdmin();break;
   case "closeAdmin":closeAdmin();render();break;
   case "sec":S.adm.sec=id;S.form=null;renderAdmin();if(id==="orders")loadOrders();break;
   case "admBack":S.adm.edit=null;S.form=null;renderAdmin();break;
   case "new":startEdit(id,null);break;
   case "edit":startEdit(t.dataset.k,id);break;
   case "pickIcon":syncForm();S.form.emoji=id;renderAdmin();break;
   case "upLogoFull":syncForm();pick(async f=>{S.form.logo_full_url=await upload(f,"logo",1200,true);renderAdmin();toast("Загружено — нажмите «Сохранить»","check")});break;
   case "rmLogoFull":syncForm();S.form.logo_full_url=null;renderAdmin();break;
   case "upLogoMark":syncForm();pick(async f=>{S.form.logo_url=await upload(f,"logo",512,true);renderAdmin();toast("Загружено — нажмите «Сохранить»","check")});break;
   case "rmLogoMark":syncForm();S.form.logo_url=null;renderAdmin();break;
   case "upBanner":syncForm();pick(async f=>{S.form.image_url=await upload(f,"banners",1800,false);renderAdmin();toast("Картинка загружена","check")});break;
   case "rmBanner":syncForm();S.form.image_url=null;renderAdmin();break;
   case "upPhoto":syncForm();pick(async f=>{S.form.photos.push(await upload(f,"products",1400,false));renderAdmin();toast("Фото загружено","check")});break;
   case "rmPhoto":syncForm();S.form.photos.splice(Number(id),1);renderAdmin();break;
   case "delItem":{const k=S.adm.edit.kind,iid=S.adm.edit.id,tbl={product:"besto_products",banner:"besto_banners",cat:"besto_categories"}[k];
     confirmBox(k==="product"?"Удалить товар?":k==="banner"?"Удалить баннер?":"Удалить категорию?",async()=>{const {error}=await sb.from(tbl).delete().eq("id",iid);if(error)return toast(errMsg(error),"info");S.adm.edit=null;S.form=null;await reload();toast("Удалено","trash")});break}
   case "delOrder":confirmBox("Удалить заказ?",async()=>{const {error}=await sb.from("besto_orders").delete().eq("id",id);if(error)return toast(errMsg(error),"info");await loadOrders();renderAdmin();toast("Удалено","trash")});break;
  }}catch(err){toast(errMsg(err),"info")}
});
document.addEventListener("change",async e=>{const t=e.target;if(t.dataset&&t.dataset.a==="status"){const {error}=await sb.from("besto_orders").update({status:t.value}).eq("id",t.dataset.id);toast(error?errMsg(error):"Статус: "+t.value,error?"info":"check");if(!error){const o=S.orders.find(x=>x.id===t.dataset.id);if(o)o.status=t.value}}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const r=$("results");if(r&&S.tab==="home"&&S.q)r.innerHTML=grid(filtered());else render()}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const fm=e.target,fd=new FormData(fm),btn=fm.querySelector("button[type=submit]"),label=btn&&btn.innerHTML;
  const busy=on=>{if(btn){btn.disabled=on;btn.innerHTML=on?'<span class="spin"></span>':label}};
  busy(true);
  try{
    if(fm.id==="authForm"){
      const email=fd.get("email").trim(),password=fd.get("pass");
      if(S.authMode==="login"){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw new Error(error.message==="Invalid login credentials"?"Неверный email или пароль":error.message);closeModal();toast("Вы вошли","check")}
      else{const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;closeModal();toast(data.session?"Аккаунт создан":"Подтвердите email по ссылке из письма","check")}
    }
    if(fm.id==="order"){
      const items=Object.entries(S.cart).map(([id,qty])=>({id,qty}));
      save("besto_contact",{name:fd.get("name"),phone:fd.get("phone"),addr:fd.get("addr")});
      const {error}=await sb.rpc("besto_place_order",{p_items:items,p_name:fd.get("name"),p_phone:fd.get("phone"),p_address:fd.get("addr"),p_comment:fd.get("comment")});
      if(error)throw error;
      S.cart={};save("besto_cart",S.cart);await reload();
      openModal(`<div style="text-align:center;padding:4px 0 6px"><div class="ok-ic">${ic("check","l")}</div><div class="h1" style="font-size:24px">Заказ оформлен</div><div class="muted" style="margin:6px 0 20px">Мы свяжемся с вами для подтверждения</div><button class="btn" data-a="closeModal">Готово</button></div>`);
      if(S.user)loadMine();return;
    }
    if(fm.id==="brandForm"){syncForm();const f=S.form;await saveSetting("brand",{name:(f.name||"").trim()||"Besto",slogan:f.slogan||"",logo_url:f.logo_url||null,logo_full_url:f.logo_full_url||null,color:f.color,color2:f.color2});S.form=null;render();toast("Бренд обновлён","check")}
    if(fm.id==="textsForm"){await saveSetting("home",{section_title:fd.get("section_title"),promo_text:fd.get("promo_text"),show_promo:fm.show_promo.checked});await saveSetting("contacts",{about:fd.get("about"),phone:fd.get("phone"),telegram:fd.get("telegram")});render();toast("Сохранено","check")}
    if(fm.id==="editForm"){
      syncForm();const f=S.form,k=f.kind,iid=S.adm.edit.id;let row,tbl;
      if(k==="product"){tbl="besto_products";row={title:f.title.trim(),price:Math.max(0,Number(f.price)||0),old_price:Number(f.old_price)>0?Number(f.old_price):null,category_id:f.category_id||null,stock:Math.max(0,parseInt(f.stock)||0),description:f.description,active:!!f.active,photos:f.photos}}
      if(k==="banner"){tbl="besto_banners";row={title:f.title,subtitle:f.subtitle,bg:f.bg,sort:parseInt(f.sort)||0,product_id:f.product_id||null,image_url:f.image_url||null,active:!!f.active}}
      if(k==="cat"){tbl="besto_categories";row={name:f.name.trim(),emoji:f.emoji||"box",sort:parseInt(f.sort)||0}}
      const {error}=await (iid?sb.from(tbl).update(row).eq("id",iid):sb.from(tbl).insert(row));if(error)throw error;
      S.adm.edit=null;S.form=null;await reload();toast("Сохранено","check");return;
    }
  }catch(err){toast(errMsg(err),"info")}
  busy(false);
});
window.bestoBack=function(){
  if($("modal").classList.contains("open")){closeModal();return true}
  if(S.sheet){closeSheet();return true}
  if(S.adm){if(S.adm.edit){S.adm.edit=null;S.form=null;renderAdmin()}else{closeAdmin();render()}return true}
  if(S.tab!=="home"||S.cat||S.q){S.tab="home";S.cat=null;S.q="";render();return true}
  return false;
};
document.addEventListener("keydown",e=>{if(e.key==="Escape")window.bestoBack()});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render())}catch(e){}

/* ---------- start ---------- */
render();
sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;if((u&&u.id)!==(S.user&&S.user.id)){S.user=u;refreshRole()}});
reload().then(()=>{const m=location.hash.match(/^#p-([0-9a-f-]{36})$/);if(m&&byId(m[1]))openSheet(m[1])});
})();
</script>
</body>
</html>
